name: KRX 시세 갱신
on:
  schedule:
    - cron: '20 7 * * 1-5'   # 평일 16:20 (한국시간) 장 마감 후
    - cron: '20 9 * * 1-5'   # 평일 18:20 (한국시간) KRX 확정 시세 재확인
  workflow_dispatch:
  push:
    paths: ['scripts/fetch-prices.mjs', '.github/workflows/prices.yml']
permissions:
  contents: write
concurrency: prices
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-prices.mjs
      - name: 변경 시 커밋
        run: |
          git config user.name "price-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet || (git commit -m "시세 갱신 $(date -u +%F)" && git push)
