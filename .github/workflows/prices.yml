name: KRX 시세 갱신
on:
  schedule:
    - cron: '20 7 * * 1-5'   # 평일 16:20 (한국시간) 장 마감 후
    - cron: '20 9 * * 1-5'   # 평일 18:20 (한국시간) 확정 시세 재확인
  workflow_dispatch:
  push:
    paths: ['scripts/fetch_prices.py', '.github/workflows/prices.yml']
permissions:
  contents: write
concurrency: prices
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q pykrx requests
      - run: python scripts/fetch_prices.py
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
      - name: 변경 시 커밋
        run: |
          git config user.name "price-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet || (git commit -m "시세 갱신 $(date -u +%F)" && git pull --rebase -q && git push)
